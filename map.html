<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SIMAC · Map</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
</head>
<body class="dark map-page">
  <div id="sharedSidebar"></div>

  <div class="main">
    <div id="sharedTopbar"></div>

    <section class="content map-content">
      <div class="backdrop">
        <div class="panel device-map-shell">
          <div class="device-map-header">
            <div>
              <div class="device-map-kicker" data-map-kicker>Map</div>
              <h1 class="device-map-title" id="mapOrgName">Gold Fields - South Deep</h1>
              <p class="device-map-subtitle">Randomized device positions for the selected organization using a global Leaflet view.</p>
            </div>
            <div class="device-map-summary">
              <div class="device-map-stat">
                <span class="device-map-stat-value" id="mapDeviceTotal">10</span>
                <span class="device-map-stat-label">Devices</span>
              </div>
              <div class="device-map-stat">
                <span class="device-map-stat-value" id="mapOnlineTotal">0</span>
                <span class="device-map-stat-label">Online</span>
              </div>
              <div class="device-map-stat">
                <span class="device-map-stat-value" id="mapAlertTotal">0</span>
                <span class="device-map-stat-label">Alerts</span>
              </div>
            </div>
          </div>

          <div class="device-map-card">
            <div class="device-map-toolbar">
              <span class="device-map-chip device-map-chip--online" id="mapChipOnline">Online 0</span>
              <span class="device-map-chip device-map-chip--idle" id="mapChipIdle">Idle 0</span>
              <span class="device-map-chip device-map-chip--alert" id="mapChipAlert">Alert 0</span>
            </div>
            <div id="deviceMap" class="device-map-canvas" aria-label="Device map"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="shared-layout.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
